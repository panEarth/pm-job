<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PM Job Monitor</title>
  <meta name="description" content="Přehled nových a dříve nalezených Product Manager pozic." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #07151c;
      --ink-soft: #1a3340;
      --fog: #d7e4ea;
      --paper: #f3f7f9;
      --line: rgba(7, 21, 28, 0.12);
      --accent: #0f766e;
      --accent-deep: #0b5a54;
      --new: #c2410c;
      --muted: #5c7380;
      --card: rgba(255, 255, 255, 0.72);
      --shadow: 0 18px 50px rgba(7, 21, 28, 0.08);
      --radius: 18px;
      --max: 760px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Outfit", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(15, 118, 110, 0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(194, 65, 12, 0.10), transparent 50%),
        linear-gradient(180deg, #eaf2f5 0%, var(--paper) 40%, #e7eef2 100%);
      min-height: 100vh;
    }

    .wrap {
      width: min(100% - 2rem, var(--max));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    header.hero {
      padding: 1.5rem 0 2rem;
      animation: rise 0.7s ease both;
    }

    .brand {
      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin: 0 0 0.75rem;
      color: var(--ink);
    }

    .lede {
      margin: 0;
      max-width: 34rem;
      color: var(--ink-soft);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .meta strong { color: var(--ink-soft); font-weight: 600; }

    .meta-run {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      text-align: left;
      text-decoration: underline;
      text-decoration-color: rgba(15, 118, 110, 0.35);
      text-underline-offset: 0.18em;
    }

    .meta-run:hover,
    .meta-run:focus-visible {
      color: var(--ink-soft);
      text-decoration-color: rgba(15, 118, 110, 0.7);
      outline: none;
    }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: rgba(28, 25, 23, 0.42);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .dialog-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .dialog {
      width: min(100%, 40rem);
      max-height: min(86vh, 44rem);
      overflow: auto;
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: 0 24px 60px rgba(28, 25, 23, 0.22);
      padding: 1.25rem 1.3rem 1.35rem;
      transform: translateY(10px);
      transition: transform 0.2s ease;
    }

    .dialog-backdrop.open .dialog {
      transform: translateY(0);
    }

    .dialog-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .dialog-head h2 {
      margin: 0;
      font-family: "Fraunces", serif;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .dialog-close {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.75);
      border-radius: 999px;
      width: 2rem;
      height: 2rem;
      font: inherit;
      line-height: 1;
      cursor: pointer;
      color: var(--ink-soft);
    }

    .dialog-close:hover {
      border-color: rgba(15, 118, 110, 0.4);
    }

    .dialog-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 1rem;
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .portal-report {
      border-top: 1px solid var(--line);
      padding: 0.85rem 0;
    }

    .portal-report:last-child {
      padding-bottom: 0;
    }

    .portal-report-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .portal-report-top h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      color: var(--ink);
    }

    .portal-status {
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .portal-status.ok { color: #0f766e; }
    .portal-status.error { color: #c2410c; }

    .portal-counts {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .portal-queries {
      margin: 0.45rem 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .portal-queries li {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      border-radius: 999px;
      padding: 0.2rem 0.55rem;
      font-size: 0.78rem;
      color: var(--ink-soft);
    }

    .portal-error {
      margin: 0.45rem 0 0;
      color: #9a3412;
      font-size: 0.84rem;
    }

    .dialog-empty {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0;
    }

    section {
      margin-top: 2.25rem;
      animation: rise 0.8s ease both;
    }

    section:nth-of-type(2) { animation-delay: 0.08s; }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--line);
    }

    .section-head h2 {
      margin: 0;
      font-family: "Fraunces", serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-head-aside {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem 0.85rem;
      margin-left: auto;
    }

    .view-toggle {
      display: inline-flex;
      padding: 0.2rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
    }

    .view-toggle button {
      appearance: none;
      border: 0;
      background: transparent;
      margin: 0;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .view-toggle button:hover {
      color: var(--ink-soft);
    }

    .view-toggle button[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
    }

    .view-toggle button:focus-visible {
      outline: 2px solid rgba(15, 118, 110, 0.45);
      outline-offset: 2px;
    }

    .count {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .count.hot { color: var(--new); }

    .list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    article.job {
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.05rem 1.15rem 1.1rem;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    article.job:hover {
      transform: translateY(-2px);
      border-color: rgba(15, 118, 110, 0.35);
    }

    article.job.new {
      border-color: rgba(194, 65, 12, 0.28);
      background:
        linear-gradient(135deg, rgba(194, 65, 12, 0.06), transparent 45%),
        var(--card);
    }

    .job-top {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      justify-content: space-between;
    }

    .job-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .job-title a {
      color: inherit;
      text-decoration: none;
    }

    .job-title a:hover { color: var(--accent-deep); text-decoration: underline; text-underline-offset: 3px; }

    .badge {
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--new);
      background: rgba(194, 65, 12, 0.1);
      border: 1px solid rgba(194, 65, 12, 0.18);
      border-radius: 999px;
      padding: 0.28rem 0.55rem;
    }

    .job-meta {
      margin-top: 0.55rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.85rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .job-meta span::before {
      content: "";
      display: inline-block;
      width: 0.35rem;
      height: 0.35rem;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 0.45rem;
      vertical-align: 0.15rem;
      opacity: 0.7;
    }

    .empty {
      padding: 1.4rem 1.1rem;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255,255,255,0.45);
    }

    .day {
      margin-top: 1.75rem;
    }

    .day:first-child {
      margin-top: 0.35rem;
    }

    .day-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin: 0 0 0.85rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px dashed var(--line);
    }

    .day-head h3 {
      margin: 0;
      font-family: "Fraunces", serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .day-head .count {
      font-size: 0.85rem;
    }

    .category {
      margin-top: 1.1rem;
    }

    .category:first-child {
      margin-top: 0.15rem;
    }

    .category-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin: 0 0 0.7rem;
    }

    .category-head h4 {
      margin: 0;
      font-family: "Outfit", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink-soft);
    }

    .category-head .count {
      font-size: 0.8rem;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
      animation: rise 0.9s ease both;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1.25rem 0 0;
    }

    .filters input[type="search"] {
      flex: 1 1 220px;
      min-width: 0;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      border-radius: 999px;
      padding: 0.7rem 1rem;
      font: inherit;
      color: var(--ink);
      outline: none;
    }

    .filters input[type="search"]:focus {
      border-color: rgba(15, 118, 110, 0.55);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .status-error {
      margin-top: 1.5rem;
      padding: 1rem 1.1rem;
      border-radius: var(--radius);
      background: rgba(194, 65, 12, 0.08);
      border: 1px solid rgba(194, 65, 12, 0.2);
      color: var(--ink-soft);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .wrap { width: min(100% - 1.25rem, var(--max)); padding-top: 1.5rem; }
      .brand { font-size: 2.2rem; }
      article.job { padding: 0.95rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1 class="brand">PM Job Monitor</h1>
      <p class="lede">Přehled Product Manager pozic ze sledovaných portálů — nové nahoře, historie pod nimi.</p>
      <div class="meta" id="meta">Načítám data…</div>
      <div class="filters">
        <input id="q" type="search" placeholder="Filtrovat podle názvu, firmy, lokace nebo portálu…" autocomplete="off" />
      </div>
    </header>

    <div id="app"></div>

    <footer>
      Data z denního monitoringu · Aktualizace po každém běhu automatizace
    </footer>
  </div>

  <div class="dialog-backdrop" id="run-dialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="run-dialog-title">
      <div class="dialog-head">
        <h2 id="run-dialog-title">Detail posledního běhu</h2>
        <button type="button" class="dialog-close" id="run-dialog-close" aria-label="Zavřít">×</button>
      </div>
      <div id="run-dialog-body"></div>
    </div>
  </div>

  <script>
    const $ = (sel, root = document) => root.querySelector(sel);

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function dateOnly(isoOrDate) {
      if (!isoOrDate) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(isoOrDate)) return isoOrDate;
      const d = new Date(isoOrDate);
      if (Number.isNaN(d.getTime())) return String(isoOrDate).slice(0, 10);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatDateDMY(value) {
      if (!value) return "—";
      // Accept YYYY-MM-DD or ISO datetime → DD.MM.YYYY
      const only = dateOnly(value);
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(only);
      if (m) return `${m[3]}.${m[2]}.${m[1]}`;
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return escapeHtml(String(value));
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const yyyy = d.getFullYear();
      return `${dd}.${mm}.${yyyy}`;
    }

    function formatDateTime(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return escapeHtml(iso);
      const date = formatDateDMY(iso);
      const time = new Intl.DateTimeFormat("cs-CZ", {
        hour: "2-digit",
        minute: "2-digit",
      }).format(d);
      return `${date} ${time}`;
    }

    function companyLabel(job) {
      const raw = (job.company || "").trim();
      if (raw) return raw;
      // Sometimes company is only in the title: "… | Firma" / "… v Firma"
      const title = job.title || "";
      const pipe = title.match(/\|\s*([^|]+)\s*$/);
      if (pipe) return pipe[1].trim();
      return "";
    }

    // Order = display order; first match wins (more specific roles first).
    // Titles are tested after lowercasing + stripping diacritics (ý→y, ž→z, …).
    const CATEGORIES = [
      { id: "cpo", label: "CPO / Chief Product Officer", test: (t) => /\b(cpo|chief product officer)\b/.test(t) },
      { id: "vp", label: "VP of Product", test: (t) => /\b(vp|vice president)\b.*\bproduct\b|\bproduct\b.*\b(vp|vice president)\b/.test(t) },
      { id: "head", label: "Head of Product", test: (t) => /\bhead of product\b|\bhead of ai product\b|\bvedouc[ii]\s+(ai\s+)?produktu\b/.test(t) },
      { id: "director", label: "Product Director", test: (t) => /\b(product director|director of product|director of ai product|reditel(ka)?\s+produktu)\b/.test(t) },
      { id: "principal", label: "Principal / Staff / Group PM", test: (t) => /\b(principal|staff|group)\s+(ai\s+)?(product\s+)?(manager|pm|owner)\b|\b(principal|staff|group)\s+pm\b/.test(t) },
      { id: "senior-pm", label: "Senior Product Manager", test: (t) => /\bsenior\s+(ai\s+)?(product\s+)?manager\b|\bsenior\s+pm\b|\bsenior\s+(ai\s+)?produktov/.test(t) },
      { id: "senior-po", label: "Senior Product Owner", test: (t) => /\bsenior\s+(ai\s+)?product\s+owner\b|\bsenior\s+(ai\s+)?produktov\w*\s+owner\b/.test(t) },
      { id: "lead", label: "Product Lead", test: (t) => /\b(ai\s+)?product\s+lead\b|\blead\s+(ai\s+)?product\b|\b(ai\s+)?produktov\w*\s+lead\b/.test(t) },
      { id: "ai-pm", label: "AI Product Manager", test: (t) => /\bai\b.*\b(product\s+manager|produktov[ya]\w*\s+mana[zs]er)\b|\b(product\s+manager|produktov[ya]\w*\s+mana[zs]er)\b.*\bai\b/.test(t) },
      { id: "pm", label: "Product Manager", test: (t) => /\bproduct\s+manager\b|\bproduktov[ya]\w*\s+mana[zs]er|\btechnical product manager\b|\bgrowth product manager\b|\bplatform product manager\b|\btpm\b/.test(t) },
      { id: "po", label: "Product Owner", test: (t) => /\bproduct\s+owner\b|\bproduktov\w*\s+owner\b/.test(t) },
      { id: "other", label: "Ostatní product role", test: () => true },
    ];

    function categorizeJob(job) {
      const t = String(job.title || "").toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      for (const cat of CATEGORIES) {
        if (cat.test(t)) return cat;
      }
      return CATEGORIES[CATEGORIES.length - 1];
    }

    function groupByCategory(jobs) {
      const buckets = new Map(CATEGORIES.map((c) => [c.id, { ...c, jobs: [] }]));
      for (const job of jobs) {
        const cat = categorizeJob(job);
        buckets.get(cat.id).jobs.push(job);
      }
      return [...buckets.values()].filter((b) => b.jobs.length > 0);
    }

    function groupByDay(jobs) {
      const buckets = new Map();
      for (const job of jobs) {
        const day = dateOnly(job.firstSeen) || "neznámé";
        if (!buckets.has(day)) buckets.set(day, []);
        buckets.get(day).push(job);
      }
      return [...buckets.entries()]
        .sort((a, b) => String(b[0]).localeCompare(String(a[0])))
        .map(([day, dayJobs]) => ({ day, jobs: dayJobs }));
    }

    function jobMatches(job, q) {
      if (!q) return true;
      const hay = [job.title, companyLabel(job), job.location, job.portal, job.url, categorizeJob(job).label]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
      return hay.includes(q);
    }

    function renderJob(job, { isNew = false } = {}) {
      const company = companyLabel(job);
      const location = job.location || "Neuvedeno";
      const portal = job.portal || "—";
      const url = job.url || "#";
      return `
        <article class="job${isNew ? " new" : ""}">
          <div class="job-top">
            <p class="job-title"><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(job.title || "Bez názvu")}</a></p>
            ${isNew ? '<span class="badge">Nové</span>' : ""}
          </div>
          <div class="job-meta">
            ${company ? `<span>${escapeHtml(company)}</span>` : ""}
            <span>${escapeHtml(location)}</span>
            <span>${escapeHtml(portal)}</span>
            <span>Poprvé: ${formatDateDMY(job.firstSeen)}</span>
          </div>
        </article>
      `;
    }

    function renderCategoryGroups(jobs, { isNew = false } = {}) {
      return groupByCategory(jobs).map((group) => `
        <div class="category">
          <div class="category-head">
            <h4>${escapeHtml(group.label)}</h4>
            <span class="count${isNew ? " hot" : ""}">${group.jobs.length}</span>
          </div>
          <div class="list">
            ${group.jobs.map((j) => renderJob(j, { isNew })).join("")}
          </div>
        </div>
      `).join("");
    }

    function renderGroupedList(jobs, { isNew = false, emptyText = "" } = {}) {
      if (!jobs.length) return `<div class="empty">${emptyText}</div>`;
      return renderCategoryGroups(jobs, { isNew });
    }

    function renderHistoryByDay(jobs, { emptyText = "" } = {}) {
      if (!jobs.length) return `<div class="empty">${emptyText}</div>`;
      return groupByDay(jobs).map(({ day, jobs: dayJobs }) => `
        <div class="day">
          <div class="day-head">
            <h3>${escapeHtml(formatDateDMY(day))}</h3>
            <span class="count">${dayJobs.length}</span>
          </div>
          ${renderCategoryGroups(dayJobs)}
        </div>
      `).join("");
    }

    function renderHistoryByRole(jobs, { emptyText = "" } = {}) {
      if (!jobs.length) return `<div class="empty">${emptyText}</div>`;
      return renderCategoryGroups(jobs);
    }

    function renderHistory(jobs, { mode = "date", emptyText = "" } = {}) {
      return mode === "role"
        ? renderHistoryByRole(jobs, { emptyText })
        : renderHistoryByDay(jobs, { emptyText });
    }

    let historyMode = "date";

    function renderRunReport(report) {
      const body = $("#run-dialog-body");
      if (!report || !Array.isArray(report.portals) || !report.portals.length) {
        body.innerHTML = `<p class="dialog-empty">Detail posledního běhu zatím není k dispozici. Objeví se po příštím skenu.</p>`;
        return;
      }
      const totals = report.totals || {};
      const portals = report.portals.map((p) => {
        const ok = p.status !== "error";
        const queries = Array.isArray(p.queries) && p.queries.length
          ? `<ul class="portal-queries">${p.queries.map((q) => `<li>${escapeHtml(q)}</li>`).join("")}</ul>`
          : "";
        const err = p.error
          ? `<p class="portal-error">${escapeHtml(p.error)}</p>`
          : "";
        return `
          <article class="portal-report">
            <div class="portal-report-top">
              <h3>${escapeHtml(p.name || "—")}</h3>
              <span class="portal-status ${ok ? "ok" : "error"}">${ok ? "OK" : "Chyba"}</span>
            </div>
            <p class="portal-counts">Načteno: <strong>${Number(p.rawCount) || 0}</strong> · Po filtrech: <strong>${Number(p.matchedCount) || 0}</strong></p>
            ${queries}
            ${err}
          </article>
        `;
      }).join("");

      body.innerHTML = `
        <div class="dialog-summary">
          <span>Začátek: <strong>${formatDateTime(report.startedAt || report.finishedAt)}</strong></span>
          <span>Konec: <strong>${formatDateTime(report.finishedAt || report.startedAt)}</strong></span>
          <span>Matched: <strong>${Number(totals.matched) || 0}</strong></span>
          <span>Nové: <strong>${Number(totals.new) || 0}</strong></span>
          <span>Chyby: <strong>${Number(totals.failures) || 0}</strong></span>
        </div>
        ${portals}
      `;
    }

    function openRunDialog() {
      const backdrop = $("#run-dialog");
      renderRunReport(window.__jobsData && window.__jobsData.lastRunReport);
      backdrop.hidden = false;
      requestAnimationFrame(() => backdrop.classList.add("open"));
      $("#run-dialog-close").focus();
    }

    function closeRunDialog() {
      const backdrop = $("#run-dialog");
      backdrop.classList.remove("open");
      window.setTimeout(() => {
        if (!backdrop.classList.contains("open")) backdrop.hidden = true;
      }, 200);
    }

    function render(data, query = "") {
      const q = query.trim().toLowerCase();
      const jobs = Array.isArray(data.jobs) ? data.jobs : [];
      const lastRunDate = dateOnly(data.lastRun);
      const filtered = jobs.filter((j) => jobMatches(j, q));

      const newest = filtered
        .filter((j) => dateOnly(j.firstSeen) === lastRunDate)
        .sort((a, b) => String(a.title).localeCompare(String(b.title), "cs"));

      const previous = filtered
        .filter((j) => dateOnly(j.firstSeen) !== lastRunDate)
        .sort((a, b) => {
          const d = String(b.firstSeen || "").localeCompare(String(a.firstSeen || ""));
          if (d !== 0) return d;
          return String(a.title || "").localeCompare(String(b.title || ""), "cs");
        });

      $("#meta").innerHTML = `
        <button type="button" class="meta-run" id="open-run-report" title="Zobrazit detail posledního běhu">
          Poslední běh: <strong>${formatDateTime(data.lastRun)}</strong>
        </button>
        <span>Celkem: <strong>${jobs.length}</strong></span>
        <span>Nové v posledním běhu: <strong>${jobs.filter((j) => dateOnly(j.firstSeen) === lastRunDate).length}</strong></span>
      `;
      $("#open-run-report").addEventListener("click", openRunDialog);

      $("#app").innerHTML = `
        <section aria-labelledby="new-heading">
          <div class="section-head">
            <h2 id="new-heading">Nové nabídky</h2>
            <span class="count hot">${newest.length}</span>
          </div>
          ${renderGroupedList(newest, {
            isNew: true,
            emptyText: q ? "Žádné nové nabídky neodpovídají filtru." : "V posledním běhu žádné nové PM pozice.",
          })}
        </section>

        <section aria-labelledby="prev-heading">
          <div class="section-head">
            <h2 id="prev-heading">Dříve nalezené</h2>
            <div class="section-head-aside">
              <div class="view-toggle" role="group" aria-label="Řazení historie">
                <button type="button" data-history-mode="date" aria-pressed="${historyMode === "date" ? "true" : "false"}">Podle data</button>
                <button type="button" data-history-mode="role" aria-pressed="${historyMode === "role" ? "true" : "false"}">Podle pozice</button>
              </div>
              <span class="count">${previous.length}</span>
            </div>
          </div>
          ${renderHistory(previous, {
            mode: historyMode,
            emptyText: q ? "Žádné starší nabídky neodpovídají filtru." : "Zatím žádná historie.",
          })}
        </section>
      `;

      $("#app").querySelectorAll("[data-history-mode]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const next = btn.getAttribute("data-history-mode");
          if (!next || next === historyMode) return;
          historyMode = next;
          render(data, query);
        });
      });
    }

    async function boot() {
      try {
        const res = await fetch("./jobs.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        window.__jobsData = data;
        render(data);
        $("#q").addEventListener("input", (e) => render(data, e.target.value));
        $("#run-dialog-close").addEventListener("click", closeRunDialog);
        $("#run-dialog").addEventListener("click", (e) => {
          if (e.target === $("#run-dialog")) closeRunDialog();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !$("#run-dialog").hidden) closeRunDialog();
        });
      } catch (err) {
        $("#meta").textContent = "Data se nepodařilo načíst.";
        $("#app").innerHTML = `<div class="status-error">Nepodařilo se načíst <code>jobs.json</code>. Spusť monitoring nebo zkontroluj GitHub Pages.</div>`;
        console.error(err);
      }
    }

    boot();
  </script>
</body>
</html>
